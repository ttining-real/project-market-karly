<!doctype html>
<html lang="ko-KR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마켓칼리</title>
  <script type="module" src="/src/pages/main/main.js"></script>
</head>

<body>
  <section class="banner__top">
    <div class="content">
      <a href="/src/pages/register/register.html">지금 가입하고 인기상품 100원에 받아가세요!</a>
      <button type="button" class="button--close">
        <span class="icon icon--cancel"></span>
      </button>
    </div>
  </section>
  <c-header></c-header>
  <main class="main">
    <section class="main__swiper">
      <div class="swiper mySwiper">
        <div class="swiper-wrapper"></div>
        <button type='button'
          class='button button--ratio button--md button--rounded button--opacity swiper-button-prev'>
          <span class='icon icon--arrow--left'></span>
        </button>
        <button type='button'
          class='button button--ratio button--md button--rounded button--opacity swiper-button-next'>
          <span class='icon icon--arrow--right'></span>
        </button>
      </div>
    </section>
    <div class="main__content">
      <section class="product--recommendation">
        <h2>이 상품은 어때요?</h2>
        <div class="product--recommendation__list">
          <div class="swiper mySwiper" id="product-swiper">
            <div class="swiper-wrapper"></div>
            <button type="button"
              class="button button--ratio button--md button--rounded button--opacity swiper-button-prev">
              <span class="icon icon--arrow--left"></span>
            </button>
            <button type="button"
              class="button button--ratio button--md button--rounded button--opacity swiper-button-next">
              <span class="icon icon--arrow--right"></span>
            </button>
            <div class="swiper-scrollbar"></div>
          </div>
        </div>
      </section>
      <section class="main__banner">
        <img src="/src/assets/banner/banner01.png" alt="Kurly Purple Week, 더 풍성해진 10월의 퍼플위크, 적립률 UP + 3종 쿠폰팩" />
      </section>
      <section class="product--eventProduct">
        <h2 class="products__title">놓치면 후회할 가격</h2>
        <div class="product--eventProduct__list">
          <div class="swiper mySwiper" id="eventProduct-swiper">
            <div class="swiper-wrapper"></div>
            <button type="button"
              class="button button--ratio button--md button--rounded button--opacity swiper-button-prev">
              <span class="icon icon--arrow--left"></span>
            </button>
            <button type="button"
              class="button button--ratio button--md button--rounded button--opacity swiper-button-next">
              <span class="icon icon--arrow--right"></span>
            </button>
            <div class="swiper-scrollbar"></div>
          </div>
      </section>
    </div>
  </main>
  <c-footer></c-footer>
  <section class="modal popup">
    <h1 class="a11y modal__title">처음 만나는 뷰티 플랫폼</h1>
    <div class="modal__content popup__image">
      <a href="/"></a>
    </div>
    <div class="button-group">
      <button type="button" class="button--lg button--cancel">오늘 하루 안 보기</button>
      <button type="button" class="button--lg button--confirm">닫기</button>
    </div>
  </section>
  <section class="recent__item">
    <h2>최근 본 상품</h2>
    <div class="swiper mySwiper recent-swiper">
      <div class="swiper-wrapper recent-swiper-wrapper">
        <!-- <div class="swiper-slide">
          <img src="" />
        </div> -->
      </div>
      <button type='button' class='button button--ratio button--md button--rounded button--opacity swiper-button-prev'>
        <span class='icon icon--arrow--top'></span>
      </button>
      <button type='button' class='button button--ratio button--md button--rounded button--opacity swiper-button-next'>
        <span class='icon icon--arrow--bottom'></span>
      </button>
    </div>
  </section>
</body>

</html>
