<!doctype html>
<html lang='ko-KR'>
  <head>
    <meta charset='UTF-8' />
    <link rel='icon' type='image/svg+xml' href='/favicon.svg' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>마켓칼리-제품 목록</title>
    <script type='module' src='/main.js'></script>
    <script type='module' src='/src/layout/header/header.js'></script>
    <script type='module' src='/src/layout/footer/footer.js'></script>
    <script type='module' src='/src/pages/product/product.js'></script>
  </head>
  <body>
    <c-header></c-header>
    <!-- product_list page layout -->
    <main class='page product'>
      <h1 class='product__title'>베스트</h1>
      <section class='product__container'>
        <nav class='sidebar'>
          <ul class='accordion'>
            <!-- head -->
            <li class='accordion__head'>
              <button type='button' class='accordion__head--item'>
                <div class='accordion__head--content'>
                  <span class='accordion__head--content-title'>카테고리</span>
                  <span class='accordion__head--content-count'>1</span>
                </div>
                <span class='icon icon--arrow--bottom'></span>
              </button>
              <!-- body -->
              <ul class='accordion__body'>
                <li class='accordion__body--item'>
                  <div class='checkbox__wrap'>
                    <input type='checkbox' class='checkbox' id='checkbox01' name='checkbox-name01' />
                    <label for='checkbox01' class='checkbox__label'>
                      <span class='checkbox__label--icon'></span>
                      <div class='checkbox__content'>
                        <span class='checkbox__content-title'>샐러드 · 간편식</span>
                        <span class='checkbox__content-count'>65</span>
                      </div>
                    </label>
                  </div>
                </li>
                <li class='accordion__body--item'>
                  <div class='checkbox__wrap'>
                    <input type='checkbox' class='checkbox' id='checkbox02' name='checkbox-name02'/>
                    <label for='checkbox02' class='checkbox__label'>
                      <span class='checkbox__label--icon'></span>
                      <div class='checkbox__content'>
                        <span class='checkbox__content-title'>국 · 반찬 · 메인요리</span>
                        <span class='checkbox__content-count'>65</span>
                      </div>
                    </label>
                  </div>
                </li>
                <li class='accordion__body--item'>
                  <div class='checkbox__wrap'>
                    <input type='checkbox' class='checkbox' id='checkbox03' name='checkbox-name03' />
                    <label for='checkbox03' class='checkbox__label'>
                      <span class='checkbox__label--icon'></span>
                      <div class='checkbox__content'>
                        <span class='checkbox__content-title'>국 · 반찬 · 메인요리</span>
                        <span class='checkbox__content-count'>65</span>
                      </div>
                    </label>
                  </div>
                </li>
                <button class='accordion__body--more'>
                  <span class='accordion__body--more-title'>카테고리 더보기</span>
                  <span class='icon icon--arrow--right'></span>
                </button>
              </ul>
            </li>
            <!-- head -->
            <li class='accordion__head'>
              <button type='button' class='accordion__head--item'>
                <div class='accordion__head--content'>
                  <span class='accordion__head--content-title'>카테고리</span>
                  <span class='accordion__head--content-count'>1</span>
                </div>
                <span class='icon icon--arrow--bottom'></span>
              </button>
              <!-- body -->
              <ul class='accordion__body'>
                <li class='accordion__body--item'>
                  <div class='checkbox__wrap'>
                    <input type='checkbox' class='checkbox' id='checkbox01' name='checkbox-name01' />
                    <label for='checkbox01' class='checkbox__label'>
                      <span class='checkbox__label--icon'></span>
                      <div class='checkbox__content'>
                        <span class='checkbox__content-title'>샐러드 · 간편식</span>
                        <span class='checkbox__content-count'>65</span>
                      </div>
                    </label>
                  </div>
                </li>
                <li class='accordion__body--item'>
                  <div class='checkbox__wrap'>
                    <input type='checkbox' class='checkbox' id='checkbox02' name='checkbox-name02' />
                    <label for='checkbox02' class='checkbox__label'>
                      <span class='checkbox__label--icon'></span>
                      <div class='checkbox__content'>
                        <span class='checkbox__content-title'>국 · 반찬 · 메인요리</span>
                        <span class='checkbox__content-count'>65</span>
                      </div>
                    </label>
                  </div>
                </li>
                <li class='accordion__body--item'>
                  <div class='checkbox__wrap'>
                    <input type='checkbox' class='checkbox' id='checkbox03' name='checkbox-name03' />
                    <label for='checkbox03' class='checkbox__label'>
                      <span class='checkbox__label--icon'></span>
                      <div class='checkbox__content'>
                        <span class='checkbox__content-title'>국 · 반찬 · 메인요리</span>
                        <span class='checkbox__content-count'>65</span>
                      </div>
                    </label>
                  </div>
                </li>
                <button class='accordion__body--more'>
                  <span class='accordion__body--more-title'>카테고리 더보기</span>
                  <span class='icon icon--arrow--right'></span>
                </button>
              </ul>
            </li>
          </ul>
        </nav>
        <div class='align'>
          <!-- count -->
          <div class='count'>총 <span id='count__card'>0</span>건</div>
          <!-- sort -->
          <ul class='list__button'>
            <li>
              <button type='button' class='list__button--recommend is--active'>추천순
                <span class='icon icon--question--mark'>
                  <span class='popup'>소비자 인기도(판매량, 판매금액, 조회수 등), 상품 출시일, 수요 적합성, 상품 운영상 필요 등을 종합적으로 고려한 순서입니다.</span>
                </span>
              </button>
            </li>
            <li aria-hidden='true'>
              <hr />
            </li>
            <li><button type='button' class='list__button--new'>신상품순</button></li>
            <li aria-hidden='true'>
              <hr />
            </li>
            <li><button type='button' class='list__button--sales'>판매량순</button></li>
            <li aria-hidden='true'>
              <hr />
            </li>
            <li><button type='button' class='list__button--benefit'>혜택순</button></li>
            <li aria-hidden='true'>
              <hr />
            </li>
            <li><button type='button' class='list__button--lowprice'>낮은 가격순</button></li>
            <li aria-hidden='true'>
              <hr />
            </li>
            <li><button type='button' class='list__button--highprice'>높은 가격순</button></li>
          </ul>
        </div>
        <!-- card -->
        <nav id='card-list' class='card__list'>   

        </nav>
        <nav class='pagination__container'>
          <ul class='pagination'>
            <li><a href='#'><span class='icon icon--arrow--prev'></span></a></li>
            <li><a href='#'><span class='icon icon--arrow--left'></span></a></li>
            <li><a href='#'>1</a></li>
            <li><a href='#'>2</a></li>
            <li><a href='#'>3</a></li>
            <li><a href='#'><span class='icon icon--arrow--right'></span></a></li>
            <li><a href='#'><span class='icon icon--arrow--next'></span></a></li>
          </ul>
        </nav>
      </section>

    <c-footer></c-footer>
