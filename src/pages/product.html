    <!-- js 아코디언 버튼 클릭이벤트 -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const accordionItems = document.querySelectorAll(
          '.accordion__head--item'
        );

        accordionItems.forEach((button) => {
          const accordionBody = button.nextElementSibling;
          const iconArrow = button.querySelector('.icon--arrow--bottom');

          accordionBody.style.maxHeight = 0; // 페이지 로드 시 아코디언 내용을 닫힌 상태로 설정
          iconArrow.style.transform = 'rotate(0deg)'; // 아이콘을 초기 회전 각도로 설정

          button.addEventListener('click', () => {
            const isOpen = button.classList.toggle('active');

            if (isOpen) {
              accordionBody.style.maxHeight = accordionBody.scrollHeight + 'px';
              iconArrow.style.transform = 'rotate(-180deg)'; // 버튼을 클릭하면 아이콘을 360도 회전
            } else {
              accordionBody.style.maxHeight = 0;
              iconArrow.style.transform = 'rotate(0deg)'; // 닫힌 상태로 돌아가면 아이콘을 원래 회전 각도로 복원
            }
          });
        });
      });
    </script>
