<!DOCTYPE html>
<html lang='ko-KR'>
<head>
  <meta charset='UTF-8' />
  <link rel='icon' type='image/svg+xml' href='/favicon.svg' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>마켓칼리 로그인</title>
  <script type='module' src='/main.js'></script>
  <script type='module' src='/src/layout/header/header.js'></script>
  <script type='module' src='/src/layout/footer/footer.js'></script>
  <script type='module' src='/src/pages/login/login.js'></script>
</head>
<body>
  <c-header></c-header>
  <section class='login__container'>
    <h2 class='login__title'>로그인</h2>
    <form action='/' class='login__form__wrap'>
      <fieldset>
        <legend class='a11y'>로그인 폼</legend>
        <div class='login__form'>
          <div class='input__field'>
            <label for='loginID' class='a11y'>아이디</label>
            <div class='input__wrap'>
              <input type='text' class='input' name='idField' id='idField' placeholder='아이디를 입력해주세요' />
              <span class='hint'>아이디는 4자 이상 20자 이하의 영문과 숫자를 포함해야 합니다.</span>
            </div>
          </div>
          <div class='input__field'>
            <label for='loginPW' class='a11y'>비밀번호</label>
            <div class='input__wrap'>
              <input type='password' class='input' name='pwField' id='pwField' placeholder='비밀번호를 입력해주세요' />
              <span class='hint'>비밀번호는 최소 6자리 이상, 숫자와 특수문자가 포함되어야 합니다.</span>
            </div>
          </div>
          <div class="button__set">
            <button type='button' class='button button--lg button--filled' id='loginButton' disabled>로그인</button>
            <a href='/src/pages/register/register.html' class='button button--lg button--outlined'>회원가입</a>
          </div>
          <ul class='list__link login__helper'>
            <li><a href='/'>아이디 찾기</a></li>
            <li aria-hidden='true'><hr /></li>
            <li><a href='/'>비밀번호 찾기</a></li>
          </ul>
        </div>
      </fieldset>
    </form>
  </section>
  <c-footer></c-footer>
</body>
</html>
